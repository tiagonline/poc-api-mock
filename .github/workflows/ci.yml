name: CI - Pipeline QA

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: write

jobs:
  api-tests:
    name: ⚡ API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Playwright
        run: npx playwright install --with-deps chromium

      - name: Subir WireMock
        run: npm run mock:start

      - name: Executar Testes de API
        env:
          API_GOVERNO_URL: http://localhost:8080
        run: npm run test:api

      - name: Salvar Allure Results API
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: allure-results
          retention-days: 1

  e2e-tests:
    name: 🖥️ E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Playwright
        run: npx playwright install --with-deps chromium

      - name: Subir WireMock
        run: npm run mock:start

      - name: Executar Testes E2E
        env:
          API_GOVERNO_URL: http://localhost:8080
          FRONTEND_URL: http://localhost:3000
        run: npm run test:e2e

      - name: Salvar Allure Results E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-e2e
          path: allure-results
          retention-days: 1

  publish-report:
    name: 📊 Publish Unified Report
    needs: [api-tests, e2e-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download de todos os resultados
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Configurar Metadados do Allure
        run: |
          cat <<EOF > allure-results/environment.properties
          Sistema_Operacional=Ubuntu Latest
          Node_Version=22.x
          Navegador=Chromium
          Ambiente=Mock Server (WireMock)
          EOF

          cat <<EOF > allure-results/categories.json
          [
            {
              "name": "Ignorados por Infra",
              "matchedStatuses": ["skipped"]
            },
            {
              "name": "Falhas de Contrato",
              "matchedStatuses": ["failed"],
              "messageRegex": ".*Violação de Contrato.*"
            }
          ]
          EOF

          cat <<EOF > allure-results/executor.json
          {
            "name": "GitHub Actions",
            "type": "github",
            "reportName": "Dashboard de Qualidade QA Guru",
            "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "buildOrder": ${{ github.run_number }},
            "buildName": "Run #${{ github.run_number }}",
            "buildUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF

      - name: Gerar Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        id: allure-report
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Central de Relatórios Unificada
        if: always()
        run: |
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ### 📊 Central de Relatórios Unificada

          | Tipo de Teste | Status | Link de Acesso |
          | :--- | :---: | :--- |
          | 🥇 **QA Dashboard** | ✅ Gerado | [Ver Allure Report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/) |
          | 🧪 **Testes de API** | ✅ Isolados | Mockados via WireMock |
          | 🖥️ **Testes E2E** | ✅ Isolados | Mockados via WireMock |

          > _Nota: Aguarde o job "pages build and deployment" finalizar o deploy._
          EOF