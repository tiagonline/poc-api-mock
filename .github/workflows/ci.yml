name: CI - Pipeline QA

on:
  push:
    branches: ["main"]
  pull_request:

# 🔐 Permissão de escrita para a Action criar a branch gh-pages
permissions:
  contents: write

jobs:
  # ==========================================
  # ⚡ JOB 1: TESTES DE API (Isolado)
  # ==========================================
  api-tests:
    name: ⚡ API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Playwright
        run: npx playwright install --with-deps chromium

      - name: Subir WireMock (Service Virtualization)
        run: npm run mock:start

      - name: Executar Testes de API
        env:
          API_GOVERNO_URL: http://localhost:8080
        run: npm run test:api

      - name: Salvar Allure Results (API)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: allure-results
          retention-days: 1

  # ==========================================
  # 🖥️ JOB 2: TESTES E2E (Isolado)
  # ==========================================
  e2e-tests:
    name: 🖥️ E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Playwright
        run: npx playwright install --with-deps chromium

      - name: Subir WireMock (Service Virtualization)
        run: npm run mock:start

      - name: Executar Testes E2E
        env:
          API_GOVERNO_URL: http://localhost:8080
          FRONTEND_URL: http://localhost:3000 # Caso tenhas app a correr, ajusta aqui
        run: npm run test:e2e

      - name: Salvar Allure Results (E2E)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-e2e
          path: allure-results
          retention-days: 1

  # ==========================================
  # 📊 JOB 3: PUBLISH UNIFIED REPORT
  # ==========================================
  publish-report:
    name: 📊 Publish Unified Report
    needs: [api-tests, e2e-tests] # Só corre depois dos testes terminarem
    if: always() # Corre mesmo que os testes falhem (para vermos o erro no report)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Faz o download dos resultados paralelos para uma pasta consolidada
      - name: Download API Results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-api
          path: allure-results

      - name: Download E2E Results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-e2e
          path: allure-results

      # Gera o relatório visual a partir dos JSONs consolidados
      - name: Gerar Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        id: allure-report
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history

      # Publica no GitHub Pages
      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      # NOVO PASSO: Injeta a Central de Relatórios "Jujubinha" no Resumo
      - name: 🔗 Central de Relatórios Unificada
        if: always()
        run: |
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ### 📊 Central de Relatórios Unificada

          | Tipo de Teste | Status | Link de Acesso |
          | :--- | :---: | :--- |
          | 🥇 **QA Dashboard (Allure)** | ✅ Gerado | [Ver Allure Report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/) |
          | 🧪 **Testes de API** | ✅ Isolados | Mockados via WireMock |
          | 🖥️ **Testes E2E** | ✅ Isolados | Mockados via WireMock |

          > _Nota: Se a página der erro 404 nos primeiros segundos, aguarde o job "pages build and deployment" do GitHub finalizar o deploy em background._
          EOF